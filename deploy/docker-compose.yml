# 本机 Docker 部署。用法：bash deploy/up.sh
# 文档：docs/docker-local.md · LAN 对接：docs/client.md
services:
  jinteng:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: jinteng:local
    restart: unless-stopped
    ports:
      # 默认只绑本机。要给 LAN 其它设备用，改成 "8787:8787"
      - "127.0.0.1:8787:8787"
    volumes:
      - jinteng-data:/data
    environment:
      JINTENG_DIR: /data
      JINTENG_LISTEN: "0.0.0.0:8787"
      JINTENG_PASSWORD_FILE: /run/secrets/jinteng_master
    secrets:
      - jinteng_master
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

secrets:
  jinteng_master:
    file: ./secrets/master.pass

volumes:
  jinteng-data:
